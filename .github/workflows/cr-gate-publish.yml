name: cr-gate publish

# The trusted half of the org review gate. The review half is injected by the
# org ruleset from Arcusfoundry/.github, so this is the only cr-gate file this
# repository needs.
#
# It cannot be injected too: `workflow_run` only fires for workflows in the
# same repository. That is also what makes it safe to hold the App credential
# here — workflow_run runs the DEFAULT branch's copy of this file, so a pull
# request cannot change what that credential does.

on:
  workflow_run:
    # Matches the `name:` of the injected review workflow. A mismatch means
    # this never fires, no check is published, and every PR sits at pending.
    workflows: ["cr-gate"]
    types: [completed]

permissions:
  actions: read

jobs:
  publish:
    uses: Arcusfoundry/.github/.github/workflows/cr-gate-publish.yml@main
    secrets: inherit
